<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>校园大冒险 · Campus Adventure</title>
<link rel="stylesheet" href="css/style.css?v=20260912i">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>

  <!-- 触屏虚拟按键（仅触屏设备显示） -->
  <div id="touch-ui">
    <div id="toolbar">
      <button class="tb" data-t="journal" title="友谊手册">📖</button>
      <button class="tb" data-t="map" title="小地图">🗺</button>
      <button class="tb" data-t="hotbar" title="工具栏">🛠</button>
      <button class="tb" data-t="vol" title="音量">🔊</button>
      <button class="tb" data-t="fs" title="全屏">⛶</button>
    </div>
    <div id="dpad">
      <button class="tk" data-k="up"    style="grid-area:u">▲</button>
      <button class="tk" data-k="left"  style="grid-area:l">◀</button>
      <button class="tk" data-k="right" style="grid-area:r">▶</button>
      <button class="tk" data-k="down"  style="grid-area:d">▼</button>
    </div>
    <div id="abtns">
      <button class="tk round" data-k="dash">疾</button>
      <button class="tk round" data-k="pose">挥</button>
      <button class="tk round" data-k="cancel">✕</button>
      <button class="tk round" data-k="ok">●</button>
    </div>
  </div>
  <!-- 竖屏提示（横屏体验更佳） -->
  <div id="rotate-tip">请横屏游玩 📱↔️<br><span>Turn your device sideways for the best view</span></div>
</div>

<!-- 启动画面：脚本加载完成、主循环画出第一帧后由 main.js 移除 -->
<div id="splash">
  <div class="sp-title">校园大冒险</div>
  <div class="sp-sub">CAMPUS ADVENTURE</div>
  <div class="sp-loading">加载中<span class="sp-dots"><i>.</i><i>.</i><i>.</i></span></div>
</div>

<script src="js/audio.js?v=20260914a" defer></script>
<script src="js/sprites.js?v=20260914a" defer></script>
<script src="js/maps.js?v=20260914a" defer></script>
<script src="js/ui.js?v=20260914a" defer></script>
<script src="js/engine.js?v=20260914a" defer></script>
<script src="js/cal.js?v=20260914a" defer></script>
<script src="js/books.js?v=20260914a" defer></script>
<script src="js/collect.js?v=20260914a" defer></script>
<script src="js/mistake.js?v=20260914a" defer></script>
<script src="js/growth.js?v=20260914a" defer></script>
<script src="js/skills.js?v=20260914a" defer></script>
<script src="js/ai.js?v=20260914a" defer></script>
<script src="js/battle.js?v=20260914a" defer></script>
<script src="js/minigame.js?v=20260914a" defer></script>
<script src="js/game.js?v=20260914a" defer></script>
<script src="js/main.js?v=20260914a" defer></script>
</body>
</html>
